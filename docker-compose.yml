services:
  db:
    image: postgres:16-alpine
    container_name: tienda_postgres
    restart: always
    environment:
      POSTGRES_DB: bd_tienda
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123098}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bd_tienda"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    image: sebas11221/tienda-pokeapi:v1.0.0
    container_name: tienda_app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/bd_tienda
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-123098}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    expose:
      - "8080"

  proxy:
    image: nginx:alpine
    container_name: tienda_proxy
    restart: always
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
