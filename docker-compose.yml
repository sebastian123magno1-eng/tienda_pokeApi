services:
  db:
    image: postgres:16-alpine
    container_name: tienda_postgres
    restart: always
    environment:
      POSTGRES_DB: bd_tienda
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123098}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bd_tienda"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: tienda_app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/bd_tienda
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-123098}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "80:8080"

volumes:
  postgres_data:
