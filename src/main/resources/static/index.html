<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Store &amp; PokeAPI | Products</title>
    <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
    <nav class="navbar">
        <div class="navbar-container">
            <a href="index.html" class="brand">
                <span class="brand-badge">JS</span>
                <span>Store &amp; PokeAPI</span>
            </a>
            <div class="nav-links">
                <a href="index.html" class="nav-link active">Products</a>
                <a href="pokemon.html" class="nav-link">Pokédex</a>
            </div>
        </div>
    </nav>

    <main class="container">
        <header class="hero-header">
            <h1 class="hero-title">Product Catalog</h1>
            <p class="hero-subtitle">
                Find peripherals, monitors and accessories. Click any card to see its full information.
            </p>
        </header>

        <!-- Search bar with instant filtering and action buttons -->
        <section class="search-section" aria-label="Product search">
            <div class="search-bar-wrapper">
                <span class="search-icon">🔍</span>
                <input
                    type="text"
                    id="searchInput"
                    class="search-input"
                    placeholder="Search by name, description or category..."
                    autocomplete="off"
                />
                <button type="button" id="clearSearchBtn" class="search-clear-btn" hidden>Clear</button>
            </div>
            <div class="search-meta">
                <div style="display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap;">
                    <span class="badge-mode">⚡ Instant search</span>
                    <button type="button" id="openCreateBtn" class="btn btn-primary btn-sm">➕ Create Product</button>
                    <button type="button" id="openEditBtn" class="btn btn-warning btn-sm">✏️ Edit Product</button>
                </div>
                <span id="resultsCount">Loading products...</span>
            </div>
        </section>

        <!-- 3-column responsive card grid -->
        <section id="productsGrid" class="cards-grid" aria-live="polite"></section>
    </main>

    <!-- Product detail modal (same page) -->
    <div id="detailModal" class="modal-overlay" role="dialog" aria-modal="true">
        <div class="modal-box">
            <img id="detailImg" src="" alt="Product image" />
            <div class="modal-body">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.6rem;">
                    <span id="detailCategory" class="type-tag">Category</span>
                    <span id="detailPrice" class="card-price">$0.00</span>
                </div>
                <h2 id="detailTitle" class="card-title" style="font-size: 1.45rem;">Name</h2>
                <p id="detailDesc" style="color: var(--text-secondary); margin: 0.85rem 0 1.4rem; line-height: 1.65;"></p>
                <div style="display: flex; justify-content: flex-end; gap: 0.6rem;">
                    <button type="button" id="detailEditBtn" class="btn btn-warning">✏️ Edit</button>
                    <button type="button" id="detailCloseBtn" class="btn btn-primary">Close</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Create / edit product modal -->
    <div id="formModal" class="modal-overlay" role="dialog" aria-modal="true">
        <div class="modal-box" style="max-width: 620px;">
            <div class="modal-body">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                    <h2 id="formTitle" class="card-title" style="margin: 0;">Create Product</h2>
                    <button type="button" id="formCloseBtn" class="search-clear-btn">✕</button>
                </div>

                <div id="editSelectorBox" style="display: none; margin-bottom: 1rem;">
                    <label for="editSelector" style="display: block; font-size: 0.88rem; color: var(--text-secondary); margin-bottom: 0.35rem;">
                        Select the product you want to edit:
                    </label>
                    <select id="editSelector" class="form-select"></select>
                </div>

                <form id="productForm" class="product-form" style="margin-top: 0;">
                    <input type="hidden" id="productId" />
                    <input type="text" id="productName" placeholder="Product name" required />
                    <input type="number" id="productPrice" step="0.01" placeholder="Price (e.g. 99.99)" required />
                    <input type="text" id="productCategory" placeholder="Category (e.g. Peripherals)" required />
                    <input type="url" id="productImage" placeholder="Image URL (optional)" />
                    <textarea id="productDescription" class="full-width" rows="4" placeholder="Product description..." required></textarea>
                    <div class="full-width" style="display: flex; justify-content: flex-end; gap: 0.75rem; margin-top: 0.5rem;">
                        <button type="button" id="formCancelBtn" class="btn btn-outline">Cancel</button>
                        <button type="submit" id="formSubmitBtn" class="btn btn-primary">Save</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script type="module" src="src/products/main.js"></script>
</body>
</html>
