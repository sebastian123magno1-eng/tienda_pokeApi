<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Store &amp; PokeAPI | Pokédex</title>
    <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
    <nav class="navbar">
        <div class="navbar-container">
            <a href="index.html" class="brand">
                <span class="brand-badge">JS</span>
                <span>Store &amp; PokeAPI</span>
            </a>
            <div class="nav-links">
                <a href="index.html" class="nav-link">Products</a>
                <a href="pokemon.html" class="nav-link active">Pokédex</a>
            </div>
        </div>
    </nav>

    <main class="container">
        <header class="hero-header">
            <h1 class="hero-title">Pokémon Explorer</h1>
            <p class="hero-subtitle">
                Search for your favorite Pokémon and click any card to see its detailed information.
            </p>
        </header>

        <!-- Search bar with a 4-second debounce -->
        <section class="search-section" aria-label="Pokémon search">
            <div class="search-bar-wrapper">
                <span class="search-icon">⚡</span>
                <input
                    type="text"
                    id="pokemonSearchInput"
                    class="search-input"
                    placeholder="Search Pokémon by name or number (e.g. pikachu, charizard, 25)..."
                    autocomplete="off"
                />
                <button type="button" id="clearPokemonSearchBtn" class="search-clear-btn" hidden>Clear</button>
            </div>

            <div id="delayProgressContainer" class="delay-progress-container">
                <div id="delayProgressBar" class="delay-progress-bar"></div>
            </div>

            <div class="search-meta">
                <span id="delayStatusBadge" class="badge-mode delay-mode">⏱️ Search with a 4s delay</span>
                <span id="pokemonResultsCount">Loading Pokémon...</span>
            </div>
        </section>

        <!-- 3-column responsive card grid -->
        <section id="pokemonGrid" class="cards-grid" aria-live="polite"></section>
    </main>

    <!-- Pokémon detail modal (same page, same URL) -->
    <div id="pokemonDetailModal" class="modal-overlay" role="dialog" aria-modal="true">
        <div class="modal-box modal-box-large">
            <div class="modal-body" id="pokemonDetailBody"></div>
        </div>
    </div>

    <script type="module" src="src/pokemon/main.js"></script>
</body>
</html>
